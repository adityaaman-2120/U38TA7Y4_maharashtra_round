x-backend-env: &backend-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DATABASE_URL: postgres://heirloom:${POSTGRES_PASSWORD}@db:5432/heirloom
  REDIS_URL: redis://redis:6379/0
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
  SIWE_ALLOWED_DOMAINS: ${SIWE_ALLOWED_DOMAINS:-localhost:3000}
  SIWE_CHAIN_IDS: ${SIWE_CHAIN_IDS:-31337,11155111,80002}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-0}
  NUM_PROXIES: ${NUM_PROXIES:-0}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Heirloom <no-reply@heirloom.local>}
  # Blockchain indexer. host.docker.internal reaches a node running on the host machine.
  RPC_URL_31337: ${RPC_URL_31337:-http://host.docker.internal:8545}
  RPC_URL_11155111: ${RPC_URL_11155111:-https://ethereum-sepolia-rpc.publicnode.com}
  RPC_URL_80002: ${RPC_URL_80002:-https://rpc-amoy.polygon.technology}
  CONFIRMATIONS_31337: ${CONFIRMATIONS_31337:-0}
  CONFIRMATIONS_11155111: ${CONFIRMATIONS_11155111:-4}
  CONFIRMATIONS_80002: ${CONFIRMATIONS_80002:-30}
  INDEX_INTERVAL_SECONDS: ${INDEX_INTERVAL_SECONDS:-15}
  REMINDER_INTERVAL_SECONDS: ${REMINDER_INTERVAL_SECONDS:-300}
  # Claim alerts: SMS to the owner via Twilio after this delay, guardians warned this long before the challenge ends.
  ALERT_SMS_AFTER_SECONDS: ${ALERT_SMS_AFTER_SECONDS:-259200}
  ALERT_GUARDIAN_BEFORE_END_SECONDS: ${ALERT_GUARDIAN_BEFORE_END_SECONDS:-86400}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}

x-backend: &backend
  build: .
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment: *backend-env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    # ABI + deployed addresses, rewritten by contracts/scripts/deploy.js. Read on every run: no rebuild after a redeploy.
    - ./chain:/app/chain:ro

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: heirloom
      POSTGRES_USER: heirloom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heirloom -d heirloom"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # cache + broker only: nonces, rate limits, task queue
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    <<: *backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  # Executes the indexer, reminder and email tasks.
  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "2"]

  # Schedules them (indexer every INDEX_INTERVAL_SECONDS, reminders every REMINDER_INTERVAL_SECONDS). Run exactly one.
  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule", "--pidfile", "/tmp/celerybeat.pid"]

volumes:
  pgdata:
